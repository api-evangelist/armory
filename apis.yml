apis:
- aid: armory:armory-scale-agent-api
  name: Armory Scale Agent API
  description: >-
    REST surface exposed by Clouddriver when the Armory Scale Agent plugin is installed. Covers the Armory-specific
    Dynamic Accounts endpoints (/agents/kubernetes/accounts) alongside the Clouddriver application, cluster, server
    group, instance, job, credential, operation, task and infrastructure endpoints. Self-hosted only - the endpoints
    are served by the customer's own Clouddriver instance, which the docs describe reaching at
    https://<clouddriver-loadbalancer-url>:<clouddriver-port>, so there is no vendor-hosted base URL.
  humanURL: https://docs.armory.io/plugins/scale-agent/reference/
  tags:
