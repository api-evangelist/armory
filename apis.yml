- aid: armory:armory-cd-gate-api
  name: Armory Continuous Deployment API (Spinnaker Gate)
  description: >-
    Armory Continuous Deployment ships the Spinnaker Gate API as its programmatic interface. Armory documents how to
    expose it for automation clients on a second Gate port (8085) secured with x509 client certificates, separately
    from the browser-facing endpoint on 8084 that uses the cluster's primary identity provider. The OpenAPI contract
    for Gate itself is the upstream Spinnaker one; Armory publishes the deployment and authentication guidance.
  humanURL: https://docs.armory.io/continuous-deployment/armory-admin/api-endpoint/
  tags:
  - Continuous Delivery
  - Spinnaker
  - Multi-Cloud
  properties:
