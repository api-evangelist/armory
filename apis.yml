aid: armory
name: Armory
description: >-
  Armory, Inc. is a San Mateo, California software company founded in 2016 that built and sold an enterprise
  distribution of the open source Spinnaker continuous delivery platform. Its product line covered Armory Continuous
  Deployment (self-hosted and Armory-managed Spinnaker), Armory Continuous Deployment-as-a-Service, and a set of
  proprietary Spinnaker plugins - the Armory Scale Agent for Spinnaker and Kubernetes, Pipelines-as-Code (Dinghy), an
  OPA-backed Policy Engine, Terraform Integration, GitHub Integration and AWS Event Cache. Armory raised more than $82M
  including a $40M Series C, and its assets were acquired by Harness in January 2024. www.armory.io now redirects to
  harness.io, but docs.armory.io remains live and still publishes the full product documentation plus a real Swagger 2.0
  API reference for the Armory Scale Agent Clouddriver surface.
image: https://docs.armory.io/favicons/android-192x192.png
url: https://raw.githubusercontent.com/api-evangelist/armory/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-06'
modified: '2026-08-06'
tags:
- Continuous Delivery
- Spinnaker
- Kubernetes
- DevOps
- Deployment Automation
- Multi-Cloud
- Pipelines
- Developer Tools
- Plugins
- Continuous Deployment
apis:
- aid: armory:armory-cd-gate-api
  name: Armory Continuous Deployment API (Spinnaker Gate)
  description: >-
    Armory Continuous Deployment ships the Spinnaker Gate API as its programmatic interface. Armory documents
    how to expose it for automation clients on a second Gate port (8085) secured with x509 client certificates,
    separately from the browser-facing endpoint on 8084 that uses the cluster's primary identity provider.
    The OpenAPI contract for Gate itself is the upstream Spinnaker one; Armory publishes the deployment
    and authentication guidance.
  humanURL: https://docs.armory.io/continuous-deployment/armory-admin/api-endpoint/
  tags:
  - Continuous Delivery
  - Spinnaker
  - Multi-Cloud
  properties:
  - type: Documentation
    url: https://docs.armory.io/continuous-deployment/armory-admin/api-endpoint/
  - type: Authentication
    url: authentication/armory-authentication.yml
  - type: Webhooks
    url: asyncapi/armory-webhooks.yml
