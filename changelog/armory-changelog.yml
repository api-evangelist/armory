note: >-
  Armory publishes dated release notes per Armory CD version, each mapped to the upstream Spinnaker
  release it tracks, and titled LTS or Feature to signal the support window. Breaking changes are
  carried forward in the notes for three minor versions from introduction. Separate release-note
  streams exist for the Armory Operator and for each plugin (Scale Agent service, Clouddriver plugin,
  Pipelines-as-Code, Policy Engine, Terraform Integration, GitHub Integration, AWS Event Cache).
  This is the recent window only; the live release-notes index is the source of truth.
