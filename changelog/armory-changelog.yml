- version: 2.40.2
  date: '2026-07-27'
  spinnaker: 2026.2.2
  category: Release
  breaking:
  - Halyard fully deprecated
  - MySQL 8+ now required
  - Redis/Valkey 7+ now required
  - AWS SDK v1 deprecated
  - OSS Spinnaker images moved to GHCR
  - Policy Engine (OPA) built into Armory CD - armory.opa block replaced by armory.policy-engine
  - Kubernetes Agent (Kubesvc) built into Armory CD
  - Gate Spring Security 5 OAuth2 migration
  - Orca tasks configuration restructured under tasks.controller
  highlights:
  - Spring Boot 3.5 upgrade
  - YAML parsing limits now configurable
  - AWS JDBC driver update
- version: 2.40.1
  date: '2026-07-15'
  spinnaker: 2026.2.2
  category: Feature
  breaking:
  - EDDA support removed
  - Halyard fully deprecated
  - MySQL 8+ now required
  - Redis/Valkey 7+ now required
  - AWS SDK v1 deprecated
  highlights:
  - Spring Boot 3.5 upgrade
  - OSS Spinnaker images moved to GHCR
