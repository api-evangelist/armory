  description: >-
    Every operation-submission endpoint on the Clouddriver /ops surface accepts an optional
    clientRequestId query parameter. Clouddriver keys the created Task on that value, so replaying a
    submission with the same clientRequestId returns the existing Task instead of starting a second
    cloud operation - the standard Spinnaker idempotency contract for orchestration retries.
  echoed_back:
    field: requestId
    schema: Task
