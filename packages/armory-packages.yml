note: >-
  Armory never shipped conventional REST client SDKs. Its distribution model is container images and
  Go libraries: 219 repositories under the armory Docker Hub organisation carry the Armory Spinnaker
  service builds, plugins and CLI, and a handful of Go modules are published as importable client and
  tooling libraries. Registries checked with no first-party result: npm (the armory-cli package on npm
  belongs to an unrelated x402 project by TheGreatAxios, not Armory Inc), PyPI (the armory package
  there is the TwoSix adversarial-robustness toolkit), Maven Central, NuGet, RubyGems, Packagist,
  crates.io and the Terraform Registry.
