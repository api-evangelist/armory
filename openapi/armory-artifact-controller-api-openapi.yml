openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Artifact Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: artifact-controller
paths:
  /artifacts/credentials:
    get:
      tags:
      - artifact-controller
      summary: list
      operationId: listUsingGET_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactCredentials'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    ArtifactCredentials:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        types:
          type: array
          items:
            type: string
      title: ArtifactCredentials
