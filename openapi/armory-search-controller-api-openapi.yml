openapi: 3.2.0
info:
  title: Armory Scale Agent Infrastructure Search Controller API
  description: Cloud infrastructure lookups - networks, subnets, VPCs, security groups, elastic IPs, instance types, reservation reports and search.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
servers:
- url: /
tags:
- name: search-controller
paths:
  /search:
    get:
      tags:
      - search-controller
      summary: search
      operationId: searchUsingGET
      parameters:
      - name: page
        in: query
        description: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 10000
      - name: platform
        in: query
        description: platform
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: q
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: type
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResultSet'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    SearchResultSet:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        platform:
          type: string
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/Map_string_object'
        totalMatches:
          type: integer
          format: int32
      title: SearchResultSet
    Map_string_object:
      type: object
      title: Map«string,object»
      additionalProperties:
        type: object
