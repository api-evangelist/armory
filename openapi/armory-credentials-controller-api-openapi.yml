openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Credentials Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: credentials-controller
paths:
  /credentials:
    get:
      tags:
      - credentials-controller
      summary: listAccountCredentials
      operationId: listAccountCredentialsUsingGET
      parameters:
      - name: expand
        in: query
        description: expand
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Map_string_object'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    post:
      tags:
      - credentials-controller
      summary: createAccount
      operationId: createAccountUsingPOST
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CredentialsDefinition'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsDefinition'
        description: definition
        required: true
    put:
      tags:
      - credentials-controller
      summary: updateAccount
      operationId: updateAccountUsingPUT
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CredentialsDefinition'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsDefinition'
        description: definition
        required: true
  /credentials/type/{accountType}:
    get:
      tags:
      - credentials-controller
      summary: listAccountsByType
      operationId: listAccountsByTypeUsingGET
      parameters:
      - name: accountType
        in: path
        description: accountType
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: limit
        required: true
        schema:
          type: string
      - name: startingAccountName
        in: query
        description: startingAccountName
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialsDefinition'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /credentials/{accountName}:
    get:
      tags:
      - credentials-controller
      summary: getAccountCredentialsDetails
      operationId: getAccountCredentialsDetailsUsingGET
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    delete:
      tags:
      - credentials-controller
      summary: deleteAccount
      operationId: deleteAccountUsingDELETE
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /credentials/{accountName}/history:
    get:
      tags:
      - credentials-controller
      summary: getAccountHistory
      operationId: getAccountHistoryUsingGET
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Revision:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/CredentialsDefinition'
        timestamp:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
      title: Revision
    CredentialsDefinition:
      type: object
      properties:
        name:
          type: string
      title: CredentialsDefinition
    Map_string_object:
      type: object
      title: Map«string,object»
      additionalProperties:
        type: object
