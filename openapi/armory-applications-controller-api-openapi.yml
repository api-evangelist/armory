openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Applications Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: applications-controller
paths:
  /applications:
    get:
      tags:
      - applications-controller
      summary: list
      operationId: listUsingGET
      parameters:
      - name: expand
        in: query
        description: expand
        required: false
        schema:
          type: boolean
          default: true
      - name: restricted
        in: query
        description: restricted
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /applications/{name}:
    get:
      tags:
      - applications-controller
      summary: get
      operationId: getUsingGET
      parameters:
      - name: name
        in: path
        description: name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationViewModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Application:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
        clusterNames:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        name:
          type: string
      title: Application
    ApplicationViewModel:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
        clusters:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ApplicationClusterViewModel'
        name:
          type: string
      title: ApplicationViewModel
    ApplicationClusterViewModel:
      type: object
      properties:
        loadBalancers:
          type: array
          items:
            type: string
        name:
          type: string
        provider:
          type: string
        serverGroups:
          type: array
          items:
            type: string
      title: ApplicationClusterViewModel
