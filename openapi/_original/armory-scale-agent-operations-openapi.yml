swagger: '2.0'
info:
  title: Armory Scale Agent Operations & Tasks API
  description: Cloud operation submission (the /ops surface), task polling/resume, and on-demand cache introspection.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
basePath: /
schemes:
- https
tags:
- name: cache-controller
- name: operations-controller
paths:
  /cache/introspection:
    get:
      tags:
      - cache-controller
      summary: getAgentIntrospections
      operationId: getAgentIntrospectionsUsingGET
      produces:
      - '*/*'
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/AgentIntrospection'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /cache/{cloudProvider}/{type}:
    get:
      tags:
      - cache-controller
      summary: pendingOnDemands
      operationId: pendingOnDemandsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        type: string
      - name: id
        in: query
        description: id
        required: false
        type: string
      - name: type
        in: path
        description: type
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/Map'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    post:
      tags:
      - cache-controller
      summary: handleOnDemand
      operationId: handleOnDemandUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        type: string
      - in: body
        name: data
        description: data
        required: true
        schema:
          type: object
      - name: type
        in: path
        description: type
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/ResponseEntity'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /ops:
    post:
      tags:
      - operations-controller
      summary: operations
      operationId: operationsUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: clientRequestId
        in: query
        description: clientRequestId
        required: false
        type: string
      - in: body
        name: requestBody
        description: requestBody
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/Map«string,Map»'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StartOperationResult'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: true
  /ops/{name}:
    post:
      tags:
      - operations-controller
      summary: operation
      operationId: operationUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: clientRequestId
        in: query
        description: clientRequestId
        required: false
        type: string
      - name: name
        in: path
        description: name
        required: true
        type: string
      - in: body
        name: requestBody
        description: requestBody
        required: true
        schema:
          type: object
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StartOperationResult'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: true
  /task:
    get:
      tags:
      - operations-controller
      summary: list
      operationId: listUsingGET_6
      produces:
      - '*/*'
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /task/{id}:
    get:
      tags:
      - operations-controller
      summary: get
      operationId: getUsingGET_1
      produces:
      - '*/*'
      parameters:
      - name: id
        in: path
        description: id
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /task/{id}:resume:
    post:
      tags:
      - operations-controller
      summary: resumeTask
      operationId: resumeTaskUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: id
        in: path
        description: id
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StartOperationResult'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /{cloudProvider}/ops:
    post:
      tags:
      - operations-controller
      summary: cloudProviderOperations
      operationId: cloudProviderOperationsUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: clientRequestId
        in: query
        description: clientRequestId
        required: false
        type: string
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        type: string
      - in: body
        name: requestBody
        description: requestBody
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/Map«string,Map»'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StartOperationResult'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /{cloudProvider}/ops/{name}:
    post:
      tags:
      - operations-controller
      summary: cloudProviderOperation
      operationId: cloudProviderOperationUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - name: clientRequestId
        in: query
        description: clientRequestId
        required: false
        type: string
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        type: string
      - name: name
        in: path
        description: name
        required: true
        type: string
      - in: body
        name: requestBody
        description: requestBody
        required: true
        schema:
          type: object
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StartOperationResult'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
definitions:
  AgentIntrospection:
    type: object
    properties:
      id:
        type: string
      lastError:
        $ref: '#/definitions/Throwable'
      lastExecutionDurationMs:
        type: integer
        format: int64
      lastExecutionStartDate:
        type: string
      lastExecutionStartMs:
        type: integer
        format: int64
      provider:
        type: string
      totalAdditions:
        type: integer
        format: int32
      totalEvictions:
        type: integer
        format: int32
    title: AgentIntrospection
  Map«string,Map»:
    type: object
    title: Map«string,Map»
    additionalProperties:
      $ref: '#/definitions/Map'
  ResponseEntity:
    type: object
    properties:
      body:
        type: object
      statusCode:
        type: string
        enum:
        - 100 CONTINUE
        - 101 SWITCHING_PROTOCOLS
        - 102 PROCESSING
        - 103 CHECKPOINT
        - 200 OK
        - 201 CREATED
        - 202 ACCEPTED
        - 203 NON_AUTHORITATIVE_INFORMATION
        - 204 NO_CONTENT
        - 205 RESET_CONTENT
        - 206 PARTIAL_CONTENT
        - 207 MULTI_STATUS
        - 208 ALREADY_REPORTED
        - 226 IM_USED
        - 300 MULTIPLE_CHOICES
        - 301 MOVED_PERMANENTLY
        - 302 FOUND
        - 302 MOVED_TEMPORARILY
        - 303 SEE_OTHER
        - 304 NOT_MODIFIED
        - 305 USE_PROXY
        - 307 TEMPORARY_REDIRECT
        - 308 PERMANENT_REDIRECT
        - 400 BAD_REQUEST
        - 401 UNAUTHORIZED
        - 402 PAYMENT_REQUIRED
        - 403 FORBIDDEN
        - 404 NOT_FOUND
        - 405 METHOD_NOT_ALLOWED
        - 406 NOT_ACCEPTABLE
        - 407 PROXY_AUTHENTICATION_REQUIRED
        - 408 REQUEST_TIMEOUT
        - 409 CONFLICT
        - 410 GONE
        - 411 LENGTH_REQUIRED
        - 412 PRECONDITION_FAILED
        - 413 PAYLOAD_TOO_LARGE
        - 413 REQUEST_ENTITY_TOO_LARGE
        - 414 URI_TOO_LONG
        - 414 REQUEST_URI_TOO_LONG
        - 415 UNSUPPORTED_MEDIA_TYPE
        - 416 REQUESTED_RANGE_NOT_SATISFIABLE
        - 417 EXPECTATION_FAILED
        - 418 I_AM_A_TEAPOT
        - 419 INSUFFICIENT_SPACE_ON_RESOURCE
        - 420 METHOD_FAILURE
        - 421 DESTINATION_LOCKED
        - 422 UNPROCESSABLE_ENTITY
        - 423 LOCKED
        - 424 FAILED_DEPENDENCY
        - 425 TOO_EARLY
        - 426 UPGRADE_REQUIRED
        - 428 PRECONDITION_REQUIRED
        - 429 TOO_MANY_REQUESTS
        - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
        - 451 UNAVAILABLE_FOR_LEGAL_REASONS
        - 500 INTERNAL_SERVER_ERROR
        - 501 NOT_IMPLEMENTED
        - 502 BAD_GATEWAY
        - 503 SERVICE_UNAVAILABLE
        - 504 GATEWAY_TIMEOUT
        - 505 HTTP_VERSION_NOT_SUPPORTED
        - 506 VARIANT_ALSO_NEGOTIATES
        - 507 INSUFFICIENT_STORAGE
        - 508 LOOP_DETECTED
        - 509 BANDWIDTH_LIMIT_EXCEEDED
        - 510 NOT_EXTENDED
        - 511 NETWORK_AUTHENTICATION_REQUIRED
      statusCodeValue:
        type: integer
        format: int32
    title: ResponseEntity
  SagaId:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
    title: SagaId
  StackTraceElement:
    type: object
    properties:
      classLoaderName:
        type: string
      className:
        type: string
      fileName:
        type: string
      lineNumber:
        type: integer
        format: int32
      methodName:
        type: string
      moduleName:
        type: string
      moduleVersion:
        type: string
      nativeMethod:
        type: boolean
    title: StackTraceElement
  StartOperationResult:
    type: object
    properties:
      id:
        type: string
      resourceUri:
        type: string
    title: StartOperationResult
  Status:
    type: object
    properties:
      completed:
        type: boolean
      failed:
        type: boolean
      phase:
        type: string
      retryable:
        type: boolean
      status:
        type: string
    title: Status
  Task:
    type: object
    properties:
      history:
        type: array
        items:
          $ref: '#/definitions/Status'
      id:
        type: string
      ownerId:
        type: string
      requestId:
        type: string
      resultObjects:
        type: array
        items:
          type: object
      retryable:
        type: boolean
      sagaIds:
        type: array
        items:
          $ref: '#/definitions/SagaId'
      startTimeMs:
        type: integer
        format: int64
      status:
        $ref: '#/definitions/Status'
    title: Task
  Throwable:
    type: object
    properties:
      cause:
        $ref: '#/definitions/Throwable'
      localizedMessage:
        type: string
      message:
        type: string
      stackTrace:
        type: array
        items:
          $ref: '#/definitions/StackTraceElement'
      suppressed:
        type: array
        items:
          $ref: '#/definitions/Throwable'
    title: Throwable
