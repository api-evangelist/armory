openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Subnet Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: subnet-controller
paths:
  /subnets:
    get:
      tags:
      - subnet-controller
      summary: list
      operationId: listUsingGET_10
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subnet'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /subnets/{cloudProvider}:
    get:
      tags:
      - subnet-controller
      summary: listByCloudProvider
      operationId: listByCloudProviderUsingGET_1
      parameters:
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subnet'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Subnet:
      type: object
      properties:
        id:
          type: string
        purpose:
          type: string
        type:
          type: string
      title: Subnet
