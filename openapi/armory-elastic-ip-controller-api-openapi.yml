openapi: 3.2.0
info:
  title: Armory Scale Agent Infrastructure Elastic Ip Controller API
  description: Cloud infrastructure lookups - networks, subnets, VPCs, security groups, elastic IPs, instance types, reservation reports and search.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
servers:
- url: /
tags:
- name: elastic-ip-controller
paths:
  /elasticIps/{account}:
    get:
      tags:
      - elastic-ip-controller
      summary: listByAccountAndRegion
      operationId: listByAccountAndRegionUsingGET
      parameters:
      - name: account
        in: path
        description: account
        required: true
        schema:
          type: string
      - name: region
        in: query
        description: region
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElasticIp'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    ElasticIp:
      type: object
      properties:
        accountName:
          type: string
        address:
          type: string
        attachedToId:
          type: string
        region:
          type: string
        type:
          type: string
      title: ElasticIp
