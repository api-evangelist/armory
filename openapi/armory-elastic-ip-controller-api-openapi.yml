openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Elastic Ip Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: elastic-ip-controller
paths:
  /elasticIps/{account}:
    get:
      tags:
      - elastic-ip-controller
      summary: listByAccountAndRegion
      operationId: listByAccountAndRegionUsingGET
      parameters:
      - name: account
        in: path
        description: account
        required: true
        schema:
          type: string
      - name: region
        in: query
        description: region
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElasticIp'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    ElasticIp:
      type: object
      properties:
        accountName:
          type: string
        address:
          type: string
        attachedToId:
          type: string
        region:
          type: string
        type:
          type: string
      title: ElasticIp
