openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Server Group Manager Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: server-group-manager-controller
paths:
  /applications/{application}/serverGroupManagers:
    get:
      tags:
      - server-group-manager-controller
      summary: getForApplication
      operationId: getForApplicationUsingGET
      parameters:
      - name: application
        in: path
        description: application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerGroupManager'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    ServerGroupManager:
      type: object
      properties:
        account:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        moniker:
          $ref: '#/components/schemas/Moniker'
        name:
          type: string
        region:
          type: string
        serverGroups:
          type: array
          items:
            $ref: '#/components/schemas/ServerGroupSummary'
      title: ServerGroupManager
    ServerGroupSummary:
      type: object
      properties:
        account:
          type: string
        moniker:
          $ref: '#/components/schemas/Moniker'
        name:
          type: string
        region:
          type: string
      title: ServerGroupSummary
    Moniker:
      type: object
      properties:
        app:
          type: string
        cluster:
          type: string
        detail:
          type: string
        sequence:
          type: integer
          format: int32
        stack:
          type: string
      title: Moniker
