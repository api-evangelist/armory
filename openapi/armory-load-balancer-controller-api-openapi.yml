openapi: 3.2.0
info:
  title: Armory Scale Agent Applications & Clusters Load Balancer Controller API
  description: Read operations across applications, clusters, server groups, server group managers, instances, load balancers, functions, raw resources and jobs.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
servers:
- url: /
tags:
- name: load-balancer-controller
paths:
  /applications/{application}/loadBalancers:
    get:
      tags:
      - load-balancer-controller
      summary: list
      operationId: listUsingGET_4
      parameters:
      - name: application
        in: path
        description: application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadBalancer'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    LoadBalancer:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        moniker:
          $ref: '#/components/schemas/Moniker'
        name:
          type: string
        serverGroups:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancerServerGroup'
        type:
          type: string
      title: LoadBalancer
    LoadBalancerServerGroup:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        detachedInstances:
          type: array
          items:
            type: string
        instances:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancerInstance'
        isDisabled:
          type: boolean
        name:
          type: string
        region:
          type: string
      title: LoadBalancerServerGroup
    LoadBalancerInstance:
      type: object
      properties:
        health:
          type: object
        id:
          type: string
        name:
          type: string
        zone:
          type: string
      title: LoadBalancerInstance
    Moniker:
      type: object
      properties:
        app:
          type: string
        cluster:
          type: string
        detail:
          type: string
        sequence:
          type: integer
          format: int32
        stack:
          type: string
      title: Moniker
