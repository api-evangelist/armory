openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Load Balancer Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: load-balancer-controller
paths:
  /applications/{application}/loadBalancers:
    get:
      tags:
      - load-balancer-controller
      summary: list
      operationId: listUsingGET_4
      parameters:
      - name: application
        in: path
        description: application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoadBalancer'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    LoadBalancerInstance:
      type: object
      properties:
        health:
          type: object
        id:
          type: string
        name:
          type: string
        zone:
          type: string
      title: LoadBalancerInstance
    Moniker:
      type: object
      properties:
        app:
          type: string
        cluster:
          type: string
        detail:
          type: string
        sequence:
          type: integer
          format: int32
        stack:
          type: string
      title: Moniker
    LoadBalancer:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        moniker:
          $ref: '#/components/schemas/Moniker'
        name:
          type: string
        serverGroups:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancerServerGroup'
        type:
          type: string
      title: LoadBalancer
    LoadBalancerServerGroup:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        detachedInstances:
          type: array
          items:
            type: string
        instances:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancerInstance'
        isDisabled:
          type: boolean
        name:
          type: string
        region:
          type: string
      title: LoadBalancerServerGroup
