openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Job Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: job-controller
paths:
  /applications/{application}/jobs/{account}/{location}/{id}:
    get:
      tags:
      - job-controller
      summary: Collect a JobStatus
      description: Collects the output of the job.
      operationId: collectJobUsingGET
      parameters:
      - name: account
        in: path
        description: Account job was created by
        required: true
        schema:
          type: string
      - name: application
        in: path
        description: Application name
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of job being looked up
        required: true
        schema:
          type: string
      - name: location
        in: path
        description: Namespace, region, or zone job is running in
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    delete:
      tags:
      - job-controller
      summary: Cancel a Job
      description: Cancels the job.
      operationId: cancelJobUsingDELETE
      parameters:
      - name: account
        in: path
        description: Account job is running in
        required: true
        schema:
          type: string
      - name: application
        in: path
        description: Application name
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of job to be canceled
        required: true
        schema:
          type: string
      - name: location
        in: path
        description: Namespace, region, or zone job is running in
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /applications/{application}/jobs/{account}/{location}/{id}/{fileName}:
    get:
      tags:
      - job-controller
      summary: Collect a file from a job
      description: Collects the file result of a job.
      operationId: getFileContentsUsingGET
      parameters:
      - name: account
        in: path
        description: Account job was created by
        required: true
        schema:
          type: string
      - name: application
        in: path
        description: Application name
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: File name to look up
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of job being looked up
        required: true
        schema:
          type: string
      - name: location
        in: path
        description: Namespace, region, or zone job is running in
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Serializable:
      type: object
      title: Serializable
    JobStatus:
      type: object
      properties:
        account:
          type: string
        completedTime:
          type: integer
          format: int64
        completionDetails:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Serializable'
        createdTime:
          type: integer
          format: int64
        id:
          type: string
        jobState:
          type: string
          enum:
          - Starting
          - Running
          - Failed
          - Succeeded
          - Unknown
        location:
          type: string
        name:
          type: string
        provider:
          type: string
      title: JobStatus
