openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Instance Type Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: instance-type-controller
paths:
  /instanceTypes:
    get:
      tags:
      - instance-type-controller
      summary: list
      operationId: listUsingGET_3
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceType'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    InstanceType:
      type: object
      properties:
        name:
          type: string
      title: InstanceType
