openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Network Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: network-controller
paths:
  /networks:
    get:
      tags:
      - network-controller
      summary: list
      operationId: listUsingGET_5
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Network'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /networks/{cloudProvider}:
    get:
      tags:
      - network-controller
      summary: listByCloudProvider
      operationId: listByCloudProviderUsingGET
      parameters:
      - name: cloudProvider
        in: path
        description: cloudProvider
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Network:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        id:
          type: string
        name:
          type: string
        region:
          type: string
      title: Network
