swagger: '2.0'
info:
  title: Armory Scale Agent Credentials API
  description: Account credential lifecycle operations - list, create, update, delete and history - plus artifact credentials.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
basePath: /
schemes:
- https
tags:
- name: artifact-controller
- name: credentials-controller
paths:
  /artifacts/credentials:
    get:
      tags:
      - artifact-controller
      summary: list
      operationId: listUsingGET_1
      produces:
      - '*/*'
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/ArtifactCredentials'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /credentials:
    get:
      tags:
      - credentials-controller
      summary: listAccountCredentials
      operationId: listAccountCredentialsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: expand
        in: query
        description: expand
        required: false
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/Map«string,object»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    post:
      tags:
      - credentials-controller
      summary: createAccount
      operationId: createAccountUsingPOST
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: definition
        description: definition
        required: true
        schema:
          $ref: '#/definitions/CredentialsDefinition'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/CredentialsDefinition'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    put:
      tags:
      - credentials-controller
      summary: updateAccount
      operationId: updateAccountUsingPUT
      consumes:
      - application/json
      produces:
      - '*/*'
      parameters:
      - in: body
        name: definition
        description: definition
        required: true
        schema:
          $ref: '#/definitions/CredentialsDefinition'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/CredentialsDefinition'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /credentials/type/{accountType}:
    get:
      tags:
      - credentials-controller
      summary: listAccountsByType
      operationId: listAccountsByTypeUsingGET
      produces:
      - '*/*'
      parameters:
      - name: accountType
        in: path
        description: accountType
        required: true
        type: string
      - name: limit
        in: query
        description: limit
        required: true
        type: string
      - name: startingAccountName
        in: query
        description: startingAccountName
        required: false
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/CredentialsDefinition'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
  /credentials/{accountName}:
    get:
      tags:
      - credentials-controller
      summary: getAccountCredentialsDetails
      operationId: getAccountCredentialsDetailsUsingGET
      produces:
      - '*/*'
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    delete:
      tags:
      - credentials-controller
      summary: deleteAccount
      operationId: deleteAccountUsingDELETE
      produces:
      - '*/*'
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: false
  /credentials/{accountName}/history:
    get:
      tags:
      - credentials-controller
      summary: getAccountHistory
      operationId: getAccountHistoryUsingGET
      produces:
      - '*/*'
      parameters:
      - name: accountName
        in: path
        description: accountName
        required: true
        type: string
      responses:
        '200':
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/Revision'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
definitions:
  ArtifactCredentials:
    type: object
    properties:
      name:
        type: string
      type:
        type: string
      types:
        type: array
        items:
          type: string
    title: ArtifactCredentials
  CredentialsDefinition:
    type: object
    properties:
      name:
        type: string
    title: CredentialsDefinition
  Map«string,object»:
    type: object
    title: Map«string,object»
    additionalProperties:
      type: object
  Revision:
    type: object
    properties:
      account:
        $ref: '#/definitions/CredentialsDefinition'
      timestamp:
        type: integer
        format: int64
      version:
        type: integer
        format: int32
    title: Revision
