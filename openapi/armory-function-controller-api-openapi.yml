openapi: 3.2.0
info:
  title: Armory Scale Agent Applications & Clusters Function Controller API
  description: Read operations across applications, clusters, server groups, server group managers, instances, load balancers, functions, raw resources and jobs.
  version: 0.13.x
  contact:
    name: Armory Docs
    url: https://docs.armory.io/plugins/scale-agent/
  x-origin:
  - format: swagger
    version: '2.0'
    url: https://docs.armory.io/reference/scale-agent/swagger.json
servers:
- url: /
tags:
- name: function-controller
paths:
  /applications/{application}/functions:
    get:
      tags:
      - function-controller
      summary: list
      operationId: listUsingGET_2
      parameters:
      - name: application
        in: path
        description: application
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Function'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Function:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        region:
          type: string
      title: Function
