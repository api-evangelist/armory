openapi: 3.2.0
info:
  description: Cloud read and write operations
  title: clouddriver Vpc Controller API
  contact:
    name: admin@host.net
servers:
- url: https://localhost:7002/
tags:
- name: vpc-controller
paths:
  /vpcs:
    get:
      tags:
      - vpc-controller
      summary: list
      operationId: listUsingGET_11
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Network'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
components:
  schemas:
    Network:
      type: object
      properties:
        account:
          type: string
        cloudProvider:
          type: string
        id:
          type: string
        name:
          type: string
        region:
          type: string
      title: Network
